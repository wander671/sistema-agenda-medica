<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>

    <form method="POST">

        <input
           type="text"
           name="usuario"
           placeholder="Usuário">

        <br><br>
        
        <input
           type="password"
           name="senha"
           placeholder="Senha">
        
        <br><br>

        <button type="submit">
            Entrar
        </button>

        
    </form>
</body>
</html>
