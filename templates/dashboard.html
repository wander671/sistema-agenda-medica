<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Agenda Médica</title>

    <!-- CSS do Tabulator -->
    <link
        href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css"
        rel="stylesheet"
    >

    <!-- CSS do sistema -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="dashboard-container">

        <!-- Cabeçalho -->
        <header class="dashboard-header">

            <div>
                <div class="dashboard-logo">🏥</div>

                <h1>Agenda Médica</h1>

                <p>Gerenciamento de consultas</p>
            </div>

            <a href="/logout" class="btn-logout">
                Sair
            </a>

        </header>


        <!-- Boas-vindas -->
        <section class="welcome-card">

            <div>
                <h2>Olá, {{ usuario }}! 👋</h2>

                <p>
                    Você está logado no sistema.
                    Aqui você pode visualizar e gerenciar as consultas médicas.
                </p>
            </div>

        </section>


        <!-- Área de consultas -->
        <section class="consultas-card">

            <div class="section-header">

                <div>
                    <h2>📋 Consultas Médicas</h2>

                    <p>
                        Consulte e gerencie os agendamentos.
                    </p>
                </div>

            </div>


            <!-- Busca Paciente-->
            <div class="search-box">

                <label for="filtro">
                   🔎 Pesquisar paciente
                </label>

                <input
                    type="text"
                    id="filtro"
                    placeholder="Digite o nome do paciente..."
                >

            </div>

            <!--Busca Médico-->
            <div class="search-box">

                <label for="filtro-medico">
                    🔎 Pesquisar médico
                </label>

                <input
                    type="text"
                    id="filtro-medico"
                    placeholder="Digite o nome do médico..."
                >

            </div>

            <!--Busca geral-->
            <div class="search-box">

                <label for="filtro-geral">
                     🔎 Busca geral
                </label>

                <input
                    type="text"
                    id="filtro-geral"
                    placeholder="Digite paciente ou médico..."
                >
            
            </div>


            <!-- Tabela -->
            <div class="table-container">

                <div id="tabela-consultas"></div>

            </div>

        </section>

    


    <!-- JavaScript do Tabulator -->
    <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>


    <script>

        // Criando a tabela
        const tabela = new Tabulator("#tabela-consultas", {

            height: "500px",

            layout: "fitColumns",

            pagination: false,

            paginationSize: 5,

            ajaxURL: "/api/consultas",

            columns: [

                {
                    title: "ID",
                    field: "id",
                    sorter: "number"
                },

                {
                    title: "Paciente",
                    field: "paciente",
                    sorter: "string",
                    headerFilter: "input"
                },

                {
                    title: "Médico",
                    field: "medico",
                    sorter: "string",
                    headerFilter: "input"
                },

                {
                    title: "Data",
                    field: "data",
                    sorter: "string",
                    headerFilter: "input"
                },

                {
                    title: "Hora",
                    field: "hora",
                    sorter: "string",
                    headerFilter: "input"
                },

                {
                    title: "Ações",

                    formatter: function(cell) {

                        return "<button class='btn-excluir'>Excluir</button>";

                    },

                    width: 100,

                    hozAlign: "center",

                    cellClick: function(e, cell) {

                        const id = cell.getRow().getData().id;

                        if (!confirm("Tem certeza que deseja excluir esta consulta?")) {
                            return;
                        }

                        fetch("/api/consultas/" + id, {
                            method: "DELETE"
                        })

                        .then(response => response.json())

                        .then(dados => {

                            if (dados.erro) {
                                alert(dados.erro);
                                return;
                            }

                            alert(dados.mensagem);

                            // Remove a linha da tabela
                            cell.getRow().delete();

                        })

                        .catch(erro => {

                            console.error("Erro:", erro);

                            alert("Erro ao excluir a consulta.");

                        });

                    }

                }

            ]

        });


// Filtro por paciente
document
    .getElementById("filtro")
    .addEventListener("keyup", function() {

        const valor = this.value;

        // Remove o filtro geral
        tabela.clearFilter();

        // Aplica filtro por paciente
        if (valor !== "") {
            tabela.setFilter("paciente", "like", valor);
        }

    });


// Filtro por médico
document
    .getElementById("filtro-medico")
    .addEventListener("keyup", function() {

        const valor = this.value;

        // Remove o filtro geral
        tabela.clearFilter();

        // Aplica filtro por médico
        if (valor !== "") {
            tabela.setFilter("medico", "like", valor);
        }

    });


// Busca geral por paciente OU médico
document
    .getElementById("filtro-geral")
    .addEventListener("keyup", function() {

        const valor = this.value.toLowerCase();

        // Limpa os filtros anteriores
        tabela.clearFilter();

        // Se estiver vazio, mostra todas as consultas
        if (valor === "") {
            return;
        }

        // Procura no paciente OU no médico
        tabela.setFilter(function(data) {

            const paciente = String(data.paciente).toLowerCase();
            const medico = String(data.medico).toLowerCase();

            return paciente.includes(valor) || medico.includes(valor);

        });

    });

    </script>

</body>
</html>
