<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Erro interno - Agenda Médica</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .container {
            background-color: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);

            max-width: 500px;
            width: 90%;
        }

        .erro {
            font-size: 80px;
            font-weight: bold;
            color: #dc2626;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;

            background-color: #2563eb;
            color: white;

            text-decoration: none;
            border-radius: 8px;

            font-weight: bold;

            transition: 0.3s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="erro">500</div>

        <h1>Erro interno do servidor</h1>

        <p>
            Ocorreu um problema inesperado.
            Nossa equipe está trabalhando para resolver.
        </p>

        <a href="/" class="btn">
            Voltar para o início
        </a>

    </div>

</body>

</html>
